<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="https://picsum.photos/id/1025/300/200" alt="Card Image">
          <h2>Beautiful Nature</h2>
        </div>
        <div class="card-back">
          <p>Experience the beauty of nature with calm forests, flowing rivers, and stunning sunsets. Embrace the peace it brings.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
